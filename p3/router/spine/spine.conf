! OSPFの設定（アンダーレイ）
router ospf
 ospf router-id 1.1.1.1
 network 1.1.1.1/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.1.4/30 area 0
 network 10.1.1.8/30 area 0

! BGPの設定（司令塔・ルートリフレクタ）
router bgp 65000
 bgp router-id 1.1.1.1
 !
 ! ピアグループ（Leafメンバ共通設定）の定義
 neighbor LEAF peer-group
 neighbor LEAF remote-as 65000
 neighbor LEAF update-source lo
 !
 ! 各Leafを連絡網に登録
 neighbor 1.1.1.2 peer-group LEAF
 neighbor 1.1.1.3 peer-group LEAF
 neighbor 1.1.1.4 peer-group LEAF
 !
 ! EVPNの有効化と「ルートリフレクタ」の設定
 address-family l2vpn evpn
  neighbor LEAF activate
  neighbor LEAF route-reflector-client  #Leaf同士反射
 exit-address-family
!
